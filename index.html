<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatham – Client Information Session | Help to Buy Scheme</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #F5F0E8;
      font-family: sans-serif;
    }

    .flyer-img {
      display: block;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      height: auto;
    }

    .img-wrap { line-height: 0; }

    /* Register button overlay section */
    .btn-section {
      background: #F5EFE5;
      text-align: center;
      padding: 28px 24px 40px;
    }

    .reg-btn {
      display: inline-block;
      background: #1B3A2D;
      color: #fff;
      font-family: 'Georgia', serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 18px 52px;
      border-radius: 3px;
      text-decoration: none;
      transition: background .2s, transform .15s;
    }
    .reg-btn:hover {
      background: #142D21;
      transform: translateY(-2px);
    }

    footer {
      background: #0E0E0E;
      color: rgba(255,255,255,.35);
      text-align: center;
      font-size: 12px;
      padding: 20px;
      letter-spacing: .05em;
    }
  </style>
</head>
<body>

  <!-- Banner + Headline + Building + Event Bar -->
  <div class="img-wrap">
    <img src="top-all-web.jpg"
         alt="Chatham Client Information Session – Help to Buy Scheme"
         class="flyer-img" />
  </div>

  <!-- Who To Bring -->
  <div class="img-wrap">
    <img src="who-block-web.jpg"
         alt="Who to Bring"
         class="flyer-img" />
  </div>

  <!-- Registration Required (original image) -->
  <div class="img-wrap">
    <img src="reg-block-web.jpg"
         alt="Registration Required"
         class="flyer-img" />
  </div>

  <!-- Register Button -->
  <div class="btn-section">
    <a href="register.html" class="reg-btn">Register via Registration Form →</a>
  </div>

  <footer>
    &copy; 2026 Chatham by Ventus &nbsp;·&nbsp; All rights reserved
  </footer>

</body>
</html>
